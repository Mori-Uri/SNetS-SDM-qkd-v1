# SNetS-QKD - Stage 2
# Wavelength x distance sweep for the multi-fiber reference scenario.

# Distances represented in Figure 1(b) of the reference analysis.
distanceValuesKm=1,5,10,15,20,25,30,35,40

# Wavelength sweep.
wavelengthStartNm=1520
wavelengthEndNm=1620
wavelengthStepNm=10

# QKD physical parameters kept from Stage 1.
meanPhotonNumber=0.7
detectorEfficiency=0.3
misalignmentError=0.015
darkCountProbability=1.0E-8
errorCorrectionEfficiency=1.16
pulseDurationSeconds=2.5E-10

# Wavelength-dependent attenuation model:
# alpha(lambda) = alpha_ref + coefficient * (lambda - lambda_ref)^2
attenuationReferenceDbPerKm=0.18
attenuationReferenceWavelengthNm=1550.0
attenuationQuadraticCoefficient=8.0E-6

# Verification point already established in Stage 1.
referenceDistanceKm=25.0
referenceWavelengthNm=1550.0
referenceSkrMbitPerSecond=93.939373
referenceToleranceMbitPerSecond=0.000001

# In this idealized attenuation model, the lowest attenuation and highest SKR
# are expected at 1550 nm for every evaluated distance.
expectedBestWavelengthNm=1550.0
wavelengthComparisonToleranceNm=0.000001

# Output directory relative to the SNetS project root.
outputDirectory=simulations/QKD_sims/Stage2_WavelengthDistance/results
