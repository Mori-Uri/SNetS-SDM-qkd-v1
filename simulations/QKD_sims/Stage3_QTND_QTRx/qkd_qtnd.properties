# SNetS-QKD - Stage 3
# Point-to-point QTND x wavelength sweep using SKR/Q-TRx.
#
# IMPORTANT:
# The point-to-point reference metric uses a CONTINUOUS EQUIVALENT number
# of Q-TRx pairs:
#     equivalent Q-TRx = totalLinkKm / QTNDKm
# This reproduces the reference optimization surface.
# Discrete Q-TRx accounting will be introduced later in the dynamic network.

# Reference point-to-point link
totalLinkKm=40.0

# QTND grid used in the reference reproduction
qtndValuesKm=5,10,15,20,25,30,35,40,45,50

# Extended C+L-band range used in our current physical-layer reproduction
wavelengthStartNm=1520.0
wavelengthEndNm=1620.0
wavelengthStepNm=10.0

# QKD physical parameters
meanPhotonNumber=0.7
detectorEfficiency=0.3
misalignmentError=0.015
darkCountProbability=1.0E-8
errorCorrectionEfficiency=1.16
pulseDurationSeconds=2.5E-10

# Wavelength-dependent attenuation model
attenuationReferenceDbPerKm=0.18
attenuationReferenceWavelengthNm=1550.0
attenuationQuadraticCoefficient=8.0E-6

# Verification target for the MF scenario
expectedBestQtndKm=25.0
expectedBestWavelengthNm=1550.0
expectedBestSkrPerQtrxMbitPerSecond=58.712108359543
referenceTolerance=1.0E-6
comparisonTolerance=1.0E-9

# Output directory, relative to the SNetS project root
outputDirectory=simulations/QKD_sims/Stage3_QTND_QTRx/results
