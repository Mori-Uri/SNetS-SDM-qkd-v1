# SNetS-QKD - Stage 4
# Discrete QKD resource planning before integration with dynamic SNetS events.

# Reference end-to-end route
routeDistanceKm=40.0
qtndKm=25.0
wavelengthNm=1550.0

# Cryptographic key policy used in the reference network model
keySizeBits=256
keyUpdateIntervalsMicroseconds=64,128,256

# QKD physical parameters already verified in Stages 1-3
meanPhotonNumber=0.7
detectorEfficiency=0.3
misalignmentError=0.015
darkCountProbability=1.0E-8
errorCorrectionEfficiency=1.16
pulseDurationSeconds=2.5E-10
attenuationReferenceDbPerKm=0.18
attenuationReferenceWavelengthNm=1550.0
attenuationQuadraticCoefficient=8.0E-6

# Stage 4 verification targets for 40 km / QTND 25 km / 1550 nm
# Segmentation: 25 km + 15 km -> one intermediate trusted node.
expectedSegmentCount=2
expectedTrustedNodeCount=1
expectedBottleneckSkrMbitPerSecond=93.939373375269

# The 1, 2 and 4 Mbit/s demands each require one QCh in each segment.
# One active QCh per segment consumes one Q-TRx pair -> 2 pairs total.
expectedQtrxPairsPerDemand=2
verificationTolerance=1.0E-6

outputDirectory=simulations/QKD_sims/Stage4_DiscreteResources/results
