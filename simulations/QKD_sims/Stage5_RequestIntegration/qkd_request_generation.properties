# SNetS-QKD - Stage 5
# QKD attributes attached to SNetS connection requests.

# Reference cryptographic policy used in the article-base.
keySizeBits=256
updateIntervalsMicroseconds=64,128,256

# Dedicated QKD random seed. This stream is intentionally independent from
# the classical traffic random stream so the QKD-policy draw does not change
# arrival and holding-time sequences.
qkdRandomSeed=2024

# Number of request objects generated only for this verification stage.
verificationRequests=30

# Classical bit rate kept in the request to verify that the original traffic
# attribute coexists with the new QKD attributes.
requiredBitRateBitsPerSecond=1.0E11
